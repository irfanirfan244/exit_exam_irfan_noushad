<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f5f0">
    <title>{% block title %}ShopSense{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ url_for('home') }}" aria-label="ShopSense home">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>shopsense</span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="{% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">Overview</a>
        <a class="{% if request.endpoint == 'predict' %}active{% endif %}" href="{{ url_for('predict') }}">Make a prediction</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <span>ShopSense · Shopping mode predictor</span>
      <span>Predictions are estimates, not shopping advice.</span>
    </footer>
  </body>
</html>
